name: Build ExpenShare

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'package.json'

jobs:
  build-windows:
    runs-on: windows-2025

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    permissions:
      contents: write

    steps:
      # 1. Check out repository
      - name: Checkout Code
        uses: actions/checkout@v7

      # 2. Setup pnpm
      - name: Setup pnpm
        uses: pnpm/setup@v2

      # 3. Publish Electron Forge release
      - name: Build and Publish
        run: pnpm run publish

      # 4. Send release to Discord
      - name: Send Release to Discord
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="$VERSION"

          echo "Version: $VERSION"
          echo "Release tag: $TAG"

          RELEASE=$(gh release view "$TAG" \
            --json name,tagName,url)

          RELEASE_NAME=$(echo "$RELEASE" | jq -r '.name')
          RELEASE_TAG=$(echo "$RELEASE" | jq -r '.tagName')
          RELEASE_URL=$(echo "$RELEASE" | jq -r '.url')

          jq -n \
            --arg name "$RELEASE_NAME" \
            --arg tag "$RELEASE_TAG" \
            --arg url "$RELEASE_URL" \
            '{
              embeds: [{
                title: ("🚀 " + $name),
                url: $url,
                color: 5763719,
                fields: [
                  {
                    name: "Version",
                    value: $tag,
                    inline: true
                  }
                ],
                footer: {
                  text: "ExpenShare • GitHub Release"
                }
              }]
            }' > payload.json

          curl \
            -f \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "$DISCORD_WEBHOOK"